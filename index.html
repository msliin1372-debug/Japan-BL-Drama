<script>
// 修复1：修正社会分类展开的选择器（选.arrow，因为箭头是点击展开的核心）
document.querySelector('.arrow').addEventListener('click', function (e) {
  e.stopPropagation(); // 防止点击箭头触发a标签跳转
  const subMenu = this.closest('.parent-item').querySelector('.sub-menu');
  this.classList.toggle('open');
  subMenu.classList.toggle('show');
});

// 侧边栏开关（原有代码保留，没问题）
const toggleBtn = document.getElementById('sidebarToggle');
const sidebar = document.getElementById('customSidebar');

toggleBtn.addEventListener('click', function() {
    sidebar.classList.toggle('hidden');
    // 切换按钮图标
    toggleBtn.innerText = sidebar.classList.contains('hidden') ? '☰' : '✕';
});

// 额外修复：点击社会链接时，只跳转不展开（避免误操作）
document.querySelector('.social-link').addEventListener('click', function (e) {
  e.stopPropagation();
});
</script>
